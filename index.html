<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Diaporama Google Photos</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    #app { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    #photo { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 1s ease-in-out; opacity: 0; }
    #login-btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #fff; border: none; border-radius: 8px; z-index: 10; }
  </style>
</head>
<body>
  <div id="app">
    <button id="login-btn">Lancer le diaporama</button>
    <img id="photo" alt="Diaporama">
  </div>

  <script>
    // === remplacez par votre ID Client ===
    const CLIENT_ID = '10646994763-672uugl4qg1t5fc3hrctm67ukafk9ank.apps.googleusercontent.com';
    const DISPLAY_DURATION = 8000; // Temps d'affichage par photo (8 sec)

    let tokenClient;
    let photos = [];
    let currentIndex = 0;

    function initOAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/photoslibrary.readonly',
        callback: async (response) => {
          if (response.access_token) {
            document.getElementById('login-btn').style.display = 'none';
            requestWakeLock();
            await fetchPhotos(response.access_token);
            startSlideshow();
          }
        },
      });
    }

    document.getElementById('login-btn').addEventListener('click', () => {
      tokenClient.requestAccessToken();
    });

    async function fetchPhotos(accessToken) {
      const res = await fetch('https://photoslibrary.googleapis.com/v1/mediaItems?pageSize=100', {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      });
      const data = await res.json();
      if (data.mediaItems) {
        photos = data.mediaItems;
      }
    }

    function startSlideshow() {
      if (photos.length === 0) return;
      showNextPhoto();
      setInterval(showNextPhoto, DISPLAY_DURATION);
    }

    function showNextPhoto() {
      const imgEl = document.getElementById('photo');
      imgEl.style.opacity = 0;

      setTimeout(() => {
        const item = photos[currentIndex];
        // On ajoute =w1920-h1080 pour forcer la résolution Full HD
        imgEl.src = `${item.baseUrl}=w1920-h1080`;
        imgEl.style.opacity = 1;
        currentIndex = (currentIndex + 1) % photos.length;
      }, 1000);
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (e) { console.log(e); }
    }

    window.onload = initOAuth;
  </script>
</body>
</html>
